<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Backlog</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='34' fill='none' stroke='%232a2724' stroke-width='7'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  /* Japandi: washi paper, sumi ink, sage and clay. Hairlines instead of shadows, one open side panel for actions. */
  :root {
    --bg: #efebe3; --surface: #f7f4ee; --ink: #2a2724; --muted: #7b756b; --line: #dad4c8;
    --accent: #6f7f6a; --accent-ink: #f7f4ee; --clay: #a47e63; --scrim: rgba(42,39,36,.28);
    --s-unreleased: #9a948a; --s-early: #b58a4e; --s-out: #7e8c74;
    --s-playing: #5e7487; --s-finished: #8a6f86; --s-abandoned: #a86258;
    --serif: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
    --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1a17; --surface: #24211d; --ink: #ece7dd; --muted: #9a9388; --line: #38342e;
      --accent: #a3b39a; --accent-ink: #1c1a17; --clay: #c29a7e; --scrim: rgba(0,0,0,.55);
      --s-unreleased: #8d877d; --s-early: #cfa468; --s-out: #9aa78f;
      --s-playing: #89a0b3; --s-finished: #b494ae; --s-abandoned: #c98479;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1a17; --surface: #24211d; --ink: #ece7dd; --muted: #9a9388; --line: #38342e;
    --accent: #a3b39a; --accent-ink: #1c1a17; --clay: #c29a7e; --scrim: rgba(0,0,0,.55);
    --s-unreleased: #8d877d; --s-early: #cfa468; --s-out: #9aa78f;
    --s-playing: #89a0b3; --s-finished: #b494ae; --s-abandoned: #c98479;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans); background: var(--bg); color: var(--ink);
    line-height: 1.65; font-size: 15px; min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .wrap {
    max-width: 1180px; margin: 0 auto; padding-block: 48px 96px;
    padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  }

  /* header */
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-bottom: 28px; border-bottom: 1px solid var(--line); }
  .kana { font-size: 12px; letter-spacing: .32em; color: var(--muted); margin-bottom: 6px; }
  h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(30px, 5vw, 44px); letter-spacing: .02em; line-height: 1.15; text-wrap: balance; }
  .actions { display: flex; gap: 20px; }
  .text-btn { background: none; border: 0; font-size: 13px; letter-spacing: .08em; color: var(--muted); padding: 4px 0; border-bottom: 1px solid transparent; }
  .text-btn:hover { color: var(--ink); border-color: var(--ink); }

  /* figures */
  .stats { display: flex; flex-wrap: wrap; gap: 28px 48px; padding: 28px 0; border-bottom: 1px solid var(--line); }
  .stat b { display: block; font-family: var(--serif); font-weight: 500; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat small { color: var(--muted); font-size: 12.5px; letter-spacing: .06em; }

  /* shelves */
  .shelf-title { font-family: var(--serif); font-weight: 500; font-size: 19px; letter-spacing: .04em; margin: 44px 0 14px; display: flex; align-items: baseline; gap: 12px; }
  .shelf-title small { font-family: var(--sans); font-size: 12px; color: var(--muted); letter-spacing: .06em; }
  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .mini { display: flex; gap: 14px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 10px; transition: border-color .2s; min-width: 0; }
  .mini:hover { border-color: var(--ink); }
  .mini img, .mini .ph { width: 92px; height: 43px; border-radius: 2px; object-fit: cover; flex: none; filter: saturate(.8); }
  .mini > div { min-width: 0; }
  .mini b { display: block; font-weight: 500; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini small { color: var(--muted); font-size: 12.5px; }
  .empty { color: var(--muted); font-size: 14px; }

  /* controls */
  .controls { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 22px 0 14px; margin-top: 44px; border-bottom: 1px solid var(--line); }
  .row { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; }
  .search { flex: 1 1 240px; min-width: 0; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 8px 0; outline: none; border-radius: 0; }
  .search:focus { border-color: var(--ink); }
  .search::placeholder { color: var(--muted); }
  select { background: none; border: 0; border-bottom: 1px solid var(--line); padding: 8px 20px 8px 0; outline: none; border-radius: 0; color: var(--muted); }
  select:focus, select:hover { color: var(--ink); border-color: var(--ink); }
  select option { background: var(--surface); color: var(--ink); }
  .tabs { margin-top: 12px; gap: 6px 22px; }
  .tab { background: none; border: 0; padding: 6px 0; font-size: 13.5px; color: var(--muted); border-bottom: 1px solid transparent; }
  .tab em { font-style: normal; font-size: 12px; margin-left: 4px; opacity: .8; }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--ink); border-color: var(--ink); }

  /* grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px 20px; margin-top: 28px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; display: flex; flex-direction: column; cursor: pointer; transition: border-color .2s; animation: in .4s both; min-width: 0; }
  .card:hover, .card.sel { border-color: var(--ink); }
  @keyframes in { from { opacity: 0; } }
  .art { aspect-ratio: 460/215; background: linear-gradient(135deg, var(--h1), var(--h2)); position: relative; overflow: hidden; border-radius: 2px 2px 0 0; max-width: 100%; }
  .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(.8) contrast(.98); }
  .art .fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; font-family: var(--serif); font-size: 20px; color: #f4efe6; text-wrap: balance; }
  .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .body h3 { font-family: var(--serif); font-weight: 500; font-size: 18px; letter-spacing: .02em; line-height: 1.35; text-wrap: balance; }
  .dev { color: var(--muted); font-size: 13px; }
  .state { display: flex; align-items: center; gap: 14px; font-size: 12.5px; color: var(--muted); letter-spacing: .05em; min-height: 20px; }
  .state span { display: inline-flex; align-items: center; gap: 7px; }
  .state i { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--muted)); }
  .tags { font-size: 12.5px; color: var(--muted); }
  .tags b { font-weight: 400; color: var(--clay); }
  .meta { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--muted); }
  .meta .hype { color: var(--clay); letter-spacing: 2px; }
  .soon { color: var(--accent); font-weight: 500; }

  /* side panel */
  .scrim { position: fixed; inset: 0; background: var(--scrim); opacity: 0; visibility: hidden; transition: opacity .25s, visibility .25s; z-index: 20; }
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); background: var(--surface); border-left: 1px solid var(--line);
    transform: translateX(100%); visibility: hidden; transition: transform .3s ease, visibility .3s; z-index: 21; overflow-y: auto;
    padding-block: 0 32px; padding-right: env(safe-area-inset-right, 0px);
  }
  body.panel-open .scrim { opacity: 1; visibility: visible; }
  body.panel-open .panel { transform: none; visibility: visible; }
  .panel .art { border-radius: 0; }
  .panel .inner { padding: 22px 24px 0; display: flex; flex-direction: column; gap: 10px; }
  .panel h2 { font-family: var(--serif); font-weight: 500; font-size: 24px; letter-spacing: .02em; line-height: 1.3; text-wrap: balance; }
  .close { position: absolute; top: 12px; right: 14px; z-index: 2; background: var(--surface); border: 1px solid var(--line); border-radius: 50%; width: 34px; height: 34px; line-height: 1; font-size: 18px; color: var(--ink); }
  .close:hover { border-color: var(--ink); }
  .label { font-size: 12px; letter-spacing: .18em; color: var(--muted); margin: 22px 0 4px; text-transform: uppercase; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; font-size: 14px; }
  .facts dt { color: var(--muted); }
  .opts { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
  .opt { display: flex; align-items: center; gap: 12px; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 13px 4px; font-size: 15px; width: 100%; }
  .opt i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
  .opt .tick { margin-left: auto; color: var(--accent); font-size: 14px; visibility: hidden; }
  .opt:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
  .opt[aria-pressed="true"] { font-weight: 700; }
  .opt[aria-pressed="true"] .tick { visibility: visible; }
  .opt:disabled { opacity: .5; cursor: progress; }
  .plinks { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 6px; }
  .plinks a { font-size: 14px; border-bottom: 1px solid var(--line); padding-bottom: 2px; text-decoration: none; }
  .plinks a:hover { border-color: var(--ink); }

  /* states */
  .center { text-align: center; padding: 72px 16px; color: var(--muted); grid-column: 1 / -1; }
  .center h2 { font-family: var(--serif); font-weight: 500; color: var(--ink); margin-bottom: 8px; }
  .gate { max-width: 380px; margin: 14vh auto 0; text-align: center; }
  .gate h2 { font-family: var(--serif); font-weight: 500; font-size: 26px; margin-bottom: 6px; }
  .gate p { color: var(--muted); font-size: 14px; }
  .gate input { width: 100%; margin: 28px 0 18px; background: none; border: 0; border-bottom: 1px solid var(--ink); padding: 10px 0; outline: none; text-align: center; border-radius: 0; }
  .btn { background: var(--ink); color: var(--bg); border: 0; border-radius: 3px; padding: 11px 28px; letter-spacing: .08em; font-size: 14px; }
  .btn:hover { background: var(--accent); color: var(--accent-ink); }
  .err { color: var(--s-abandoned); font-size: 13px; min-height: 20px; margin-top: 12px; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 16px); background: var(--ink); color: var(--bg); padding: 10px 20px; border-radius: 3px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 30; max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.bad { background: var(--s-abandoned); color: #fff; }
  .skeleton { aspect-ratio: 4/3; border-radius: 3px; background: linear-gradient(90deg, var(--surface) 25%, var(--line) 50%, var(--surface) 75%); background-size: 200% 100%; animation: sh 1.4s infinite; }
  @keyframes sh { to { background-position: -200% 0; } }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div>
      <div class="kana">積みゲー</div>
      <h1>Game Backlog</h1>
    </div>
    <div class="actions">
      <button class="text-btn" id="refresh" type="button">Refresh</button>
      <button class="text-btn" id="theme" type="button">Light / Dark</button>
      <button class="text-btn" id="lock" type="button" hidden>Lock</button>
    </div>
  </header>

  <section id="gate" class="gate" hidden>
    <h2>Enter your key</h2>
    <p>The same <code>SECRET_KEY</code> your bot is deployed with.</p>
    <form id="gateForm">
      <input id="keyInput" type="password" placeholder="Secret key" autocomplete="current-password" aria-label="Secret key" required>
      <button class="btn" type="submit">Open</button>
    </form>
    <div class="err" id="gateErr" role="alert"></div>
  </section>

  <main id="main" hidden>
    <div class="stats" id="stats"></div>
    <div id="shelves"></div>
    <div class="controls">
      <div class="row">
        <input class="search" id="q" type="search" placeholder="Search games, developers, genres" aria-label="Search">
        <select id="genre" aria-label="Genre"></select>
        <select id="platform" aria-label="Platform"></select>
        <select id="sort" aria-label="Sort">
          <option value="added">Recently added</option>
          <option value="release-asc">Release date, soonest</option>
          <option value="release-desc">Release date, latest</option>
          <option value="hype">Most hyped</option>
          <option value="length">Shortest to beat</option>
          <option value="name">Name A to Z</option>
        </select>
      </div>
      <div class="row tabs" id="statusTabs" role="group" aria-label="Filter by status"></div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle" aria-hidden="true">
  <button class="close" id="pClose" type="button" aria-label="Close">×</button>
  <div id="pBody"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const STATUS_COLOR = { "Unreleased": "var(--s-unreleased)", "Early Access": "var(--s-early)", "Out": "var(--s-out)",
  "Playing": "var(--s-playing)", "Finished": "var(--s-finished)", "Abandoned": "var(--s-abandoned)" };
const STATUS_ORDER = Object.keys(STATUS_COLOR);
// "Unreleased" and "Out" describe the release, not your progress, so they are never labelled on cards or tabs.
const QUIET = new Set(["Unreleased", "Out"]);
const HYPE_RANK = { "★★★": 3, "★★": 2, "★": 1 };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const DEMO = !!window.__DEMO__ || new URLSearchParams(location.search).has("demo");

let games = [];
const state = { q: "", status: "", genre: "", platform: "", sort: "added" };
let openId = null, lastFocus = null;

/* ── data ── */
async function load() {
  if (DEMO) { games = demoGames(); show(); return; }
  const key = store.get("gbb-key");
  if (!key) return showGate();
  $("main").hidden = false; $("gate").hidden = true;
  $("grid").innerHTML = '<div class="skeleton"></div>'.repeat(6);
  try {
    const r = await fetch("/api/games", { headers: { "x-secret-key": key } });
    if (r.status === 401) { store.del("gbb-key"); return showGate("That key didn't work."); }
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
    games = (await r.json()).games;
    show();
  } catch (e) {
    $("grid").innerHTML = `<div class="center"><h2>Couldn't load your backlog</h2>${esc(e.message)}</div>`;
  }
}
function showGate(msg = "") {
  closePanel(); $("main").hidden = true; $("gate").hidden = false; $("lock").hidden = true;
  $("gateErr").textContent = msg; $("keyInput").focus();
}
function show() {
  $("gate").hidden = true; $("main").hidden = false; $("lock").hidden = DEMO || !store.get("gbb-key");
  buildSelects(); render();
}

/* ── helpers ── */
function steamId(g) { return (/store\.steampowered\.com\/app\/(\d+)/.exec(g.store) || [])[1]; }
function ytId(g) { return (/(?:v=|youtu\.be\/|shorts\/)([\w-]{11})/.exec(g.video) || [])[1]; }
function art(g) {
  const id = steamId(g); if (id) return `https://cdn.cloudflare.steamstatic.com/steam/apps/${id}/header.jpg`;
  const y = ytId(g); return y ? `https://i.ytimg.com/vi/${y}/hqdefault.jpg` : "";
}
function hues(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360; return [`hsl(${h} 16% 44%)`, `hsl(${(h + 30) % 360} 18% 30%)`]; }
function daysUntil(d) { return d ? Math.ceil((new Date(d + "T00:00:00") - new Date().setHours(0, 0, 0, 0)) / 864e5) : null; }
function fmtDate(d) {
  if (!d) return "Date to be announced";
  return new Date(d.length > 10 ? d : d + "T00:00:00").toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}
function whenLabel(g) {
  const n = daysUntil(g.release_date);
  if (n !== null && n > 0) return `<span class="soon">${n === 1 ? "Tomorrow" : "In " + (n > 60 ? Math.round(n / 30) + " months" : n + " days")}</span>`;
  return esc(fmtDate(g.release_date));
}
function artBlock(g) {
  const a = art(g), [h1, h2] = hues(g.name);
  return `<div class="art" style="--h1:${h1};--h2:${h2}"><div class="fallback">${esc(g.name)}</div>${a ? `<img src="${esc(a)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</div>`;
}
const statusMark = g => g.status && !QUIET.has(g.status) ? `<span style="--c:${STATUS_COLOR[g.status]}"><i></i>${esc(g.status)}</span>` : "";

/* ── filters ── */
function counts(key) {
  const m = new Map();
  games.forEach(g => (Array.isArray(g[key]) ? g[key] : [g[key]]).filter(Boolean).forEach(v => m.set(v, (m.get(v) || 0) + 1)));
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}
function buildSelects() {
  const opt = (label, list) => `<option value="">${label}</option>` + list.map(([v, n]) => `<option value="${esc(v)}">${esc(v)} (${n})</option>`).join("");
  $("genre").innerHTML = opt("All genres", counts("genres"));
  $("platform").innerHTML = opt("All platforms", counts("platforms"));
}
function buildTabs() {
  const st = new Map(counts("status"));
  const tab = (s, label, n) => `<button class="tab${state.status === s ? " on" : ""}" type="button" data-s="${s}" aria-pressed="${state.status === s}">${label}<em>${n}</em></button>`;
  $("statusTabs").innerHTML = tab("", "All", games.length) +
    STATUS_ORDER.filter(s => !QUIET.has(s) && st.has(s)).map(s => tab(s, s, st.get(s))).join("");
}
function visible() {
  const q = state.q.toLowerCase();
  const list = games.filter(g =>
    (!state.status || g.status === state.status) &&
    (!state.genre || g.genres.includes(state.genre)) &&
    (!state.platform || g.platforms.includes(state.platform)) &&
    (!q || [g.name, g.developer, ...g.genres, ...g.platforms].join(" ").toLowerCase().includes(q)));
  const by = {
    added: (a, b) => (b.added || "").localeCompare(a.added || ""),
    "release-asc": (a, b) => (a.release_date || "9").localeCompare(b.release_date || "9"),
    "release-desc": (a, b) => (b.release_date || "").localeCompare(a.release_date || ""),
    hype: (a, b) => (HYPE_RANK[b.hype] || 0) - (HYPE_RANK[a.hype] || 0),
    length: (a, b) => (a.time_to_beat ?? 1e9) - (b.time_to_beat ?? 1e9),
    name: (a, b) => a.name.localeCompare(b.name),
  }[state.sort];
  return list.sort(by);
}

/* ── render ── */
function render() {
  renderStats(); renderShelves(); buildTabs();
  const list = visible();
  $("grid").innerHTML = list.length ? list.map(card).join("") : '<div class="center"><h2>Nothing matches</h2>Try clearing a filter.</div>';
}
function renderStats() {
  const backlog = games.filter(g => ["Out", "Early Access"].includes(g.status));
  const hours = backlog.reduce((s, g) => s + (g.time_to_beat || 0), 0);
  const soon = games.filter(g => g.status === "Unreleased" && daysUntil(g.release_date) > 0)
    .sort((a, b) => a.release_date.localeCompare(b.release_date))[0];
  const c = n => games.filter(g => g.status === n).length;
  const tiles = [
    [games.length, "games"], [games.filter(g => g.installed).length, "installed"], [c("Playing"), "playing"],
    [c("Finished"), "finished"], [hours ? Math.round(hours) + "h" : "–", "of backlog"],
    [soon ? daysUntil(soon.release_date) + "d" : "–", soon ? "until " + soon.name : "to next release"],
  ];
  $("stats").innerHTML = tiles.map(([n, l]) => `<div class="stat"><b>${esc(n)}</b><small>${esc(l)}</small></div>`).join("");
}
function mini(g, sub) {
  const a = art(g), [h1, h2] = hues(g.name);
  const ph = `<div class="ph" style="background:linear-gradient(135deg,${h1},${h2})"></div>`;
  return `<button class="mini" type="button" data-id="${esc(g.id)}">
    ${a ? `<img src="${esc(a)}" alt="" loading="lazy" onerror="this.outerHTML=this.dataset.ph" data-ph="${esc(ph)}">` : ph}
    <div><b>${esc(g.name)}</b><small>${sub}</small></div></button>`;
}
function renderShelves() {
  const installed = games.filter(g => g.installed)
    .sort((a, b) => (a.status === "Playing" ? 0 : 1) - (b.status === "Playing" ? 0 : 1) || a.name.localeCompare(b.name));
  const playing = games.filter(g => g.status === "Playing");
  const upcoming = games.filter(g => g.status === "Unreleased" && daysUntil(g.release_date) > 0)
    .sort((a, b) => a.release_date.localeCompare(b.release_date)).slice(0, 4);
  const shelf = (title, note, items, sub, emptyMsg = "") => (items.length || emptyMsg) ?
    `<div class="shelf-title">${title}<small>${note}</small></div>` +
    (items.length ? `<div class="shelf">${items.map(g => mini(g, sub(g))).join("")}</div>` : `<p class="empty">${emptyMsg}</p>`) : "";
  $("shelves").innerHTML =
    shelf("Ready to Play", "installed on your machine", installed,
      g => esc([QUIET.has(g.status) ? "" : g.status, g.time_to_beat ? g.time_to_beat + "h to beat" : ""].filter(Boolean).join(" · ") || "Installed"),
      "Nothing installed yet. Tick “Installed” in Notion and the game appears here.") +
    shelf("Now playing", "", playing, g => esc(g.developer || "In progress")) +
    shelf("Coming soon", "", upcoming, g => whenLabel(g));
}
function card(g, i) {
  const tags = [...g.genres.slice(0, 3).map(esc), ...g.platforms.map(p => `<b>${esc(p)}</b>`)].join(" · ");
  const extra = [g.time_to_beat ? g.time_to_beat + "h" : "", g.rating].filter(Boolean).map(esc).join(" · ");
  return `<article class="card${g.id === openId ? " sel" : ""}" tabindex="0" role="button" data-id="${esc(g.id)}" aria-label="${esc(g.name)}, open details" style="animation-delay:${Math.min(i, 12) * 25}ms">
    ${artBlock(g)}
    <div class="body">
      <h3>${esc(g.name)}</h3>
      ${g.developer ? `<div class="dev">${esc(g.developer)}</div>` : ""}
      <div class="state">${g.installed ? '<span style="--c:var(--accent)"><i></i>Installed</span>' : ""}${statusMark(g)}</div>
      <div class="tags">${tags}</div>
      <div class="meta"><span>${whenLabel(g)}${extra ? " · " + extra : ""}</span>${g.hype ? `<span class="hype" title="Hype">${esc(g.hype)}</span>` : ""}</div>
    </div></article>`;
}

/* ── side panel ── */
function openPanel(id) {
  const g = games.find(x => x.id === id); if (!g) return;
  lastFocus = document.activeElement; openId = id;
  paintPanel(g);
  document.body.classList.add("panel-open"); $("panel").setAttribute("aria-hidden", "false");
  document.querySelectorAll(".card").forEach(c => c.classList.toggle("sel", c.dataset.id === id));
  $("pClose").focus({ preventScroll: true });
}
function closePanel() {
  if (!openId) return;
  openId = null; document.body.classList.remove("panel-open"); $("panel").setAttribute("aria-hidden", "true");
  document.querySelectorAll(".card.sel").forEach(c => c.classList.remove("sel"));
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
}
function paintPanel(g) {
  const links = [["Store page", g.store], ["Reviews", g.review], ["Trailer", g.video], ["Open in Notion", g.url]]
    .filter(([, u]) => safeUrl(u)).map(([l, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${l}</a>`).join("");
  const fact = (k, v) => v ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : "";
  $("pBody").innerHTML = `${artBlock(g)}
    <div class="inner">
      <h2 id="pTitle">${esc(g.name)}</h2>
      ${g.developer ? `<div class="dev">${esc(g.developer)}</div>` : ""}
      <dl class="facts" style="margin-top:8px">
        ${fact("Release", g.release_date ? fmtDate(g.release_date) : "")}${fact("Length", g.time_to_beat ? g.time_to_beat + " hours" : "")}
        ${fact("Genre", g.genres.join(", "))}${fact("Platform", g.platforms.join(", "))}
        ${fact("Hype", g.hype)}${fact("Your rating", g.rating)}${fact("Installed", g.installed ? "Yes" : "")}
      </dl>
      <div class="label" id="pStatusLabel">Status</div>
      <div class="opts" role="group" aria-labelledby="pStatusLabel">
        ${STATUS_ORDER.map(s => `<button class="opt" type="button" data-status="${s}" aria-pressed="${g.status === s}" style="--c:${STATUS_COLOR[s]}"><i></i>${s}<span class="tick">✓</span></button>`).join("")}
      </div>
      ${links ? `<div class="label">Links</div><div class="plinks">${links}</div>` : ""}
    </div>`;
}

/* ── status changes ── */
let toastTimer;
function toast(msg, bad = false) {
  const t = $("toast"); t.textContent = msg; t.classList.toggle("bad", bad); t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
async function setStatus(id, status) {
  const g = games.find(x => x.id === id); if (!g || g.status === status) return;
  const prev = g.status;
  g.status = status; render(); paintPanel(g);                 // optimistic, rolled back on failure
  if (DEMO) return toast(`${g.name}: ${status}`);
  const busy = $("pBody").querySelectorAll(".opt"); busy.forEach(b => b.disabled = true);
  try {
    const r = await fetch("/api/game-status", {
      method: "POST", headers: { "content-type": "application/json", "x-secret-key": store.get("gbb-key") || "" },
      body: JSON.stringify({ id, status }),
    });
    if (r.status === 401) { store.del("gbb-key"); throw new Error("Your key is no longer valid. Reload to enter it again."); }
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
    toast(`${g.name}: ${status}`);
  } catch (e) {
    g.status = prev; render();
    if (openId === id) paintPanel(g);
    toast(`Not saved. ${e.message}`, true);
  }
}

/* ── events ── */
let t; $("q").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value.trim(); render(); }, 120); });
for (const k of ["genre", "platform", "sort"]) $(k).addEventListener("change", e => { state[k] = e.target.value; render(); });
$("statusTabs").addEventListener("click", e => { const c = e.target.closest(".tab"); if (c) { state.status = c.dataset.s; render(); } });
for (const id of ["grid", "shelves"]) {
  $(id).addEventListener("click", e => { const c = e.target.closest("[data-id]"); if (c) openPanel(c.dataset.id); });
}
$("grid").addEventListener("keydown", e => {
  const c = e.target.closest(".card"); if (c && e.target === c && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openPanel(c.dataset.id); }
});
$("pBody").addEventListener("click", e => { const b = e.target.closest(".opt"); if (b && openId) setStatus(openId, b.dataset.status); });
$("pClose").onclick = closePanel; $("scrim").onclick = closePanel;
document.addEventListener("keydown", e => { if (e.key === "Escape") closePanel(); });
$("refresh").onclick = () => { closePanel(); load(); };
$("lock").onclick = () => { store.del("gbb-key"); showGate(); };
$("gateForm").addEventListener("submit", e => { e.preventDefault(); store.set("gbb-key", $("keyInput").value.trim()); $("keyInput").value = ""; load(); });
$("theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark"; document.documentElement.dataset.theme = next; store.set("gbb-theme", next);
};
if (store.get("gbb-theme")) document.documentElement.dataset.theme = store.get("gbb-theme");
